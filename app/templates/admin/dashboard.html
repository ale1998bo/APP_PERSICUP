{% extends 'base.html' %}
{% block title %}Admin Panel — Torneo Calcio{% endblock %}

{% block content %}
<section class="page-section">
    <div class="container admin-wrap">

        <div class="admin-head">
            <h2 class="page-title">Admin Panel</h2>
        </div>

        <!-- Stats -->
        <div class="stat-row">
            <div class="stat-pill">
                <div class="stat-num">{{ total_teams }}</div>
                <div class="stat-lbl">Squadre</div>
            </div>
            <div class="stat-pill">
                <div class="stat-num">{{ total_matches }}</div>
                <div class="stat-lbl">Partite</div>
            </div>
            <div class="stat-pill">
                <div class="stat-num">{{ played_matches }}</div>
                <div class="stat-lbl">Giocate</div>
            </div>
            <div class="stat-pill">
                <div class="stat-num">{{ playoff_matches }}</div>
                <div class="stat-lbl">Playoff</div>
            </div>
        </div>

        <!-- Gestione risultati -->
        <div class="admin-block">
            <div class="admin-block-head">
                <span>Gestione risultati</span>
            </div>
            <a href="{{ url_for('admin.match_manager') }}" class="btn-clean btn-clean--block">
                Vai al Match Manager
            </a>
        </div>

    </div>
</section>
{% endblock %}
